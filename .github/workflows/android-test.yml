name: Android test build

# Pushing to the android-test branch builds the APK and puts it on a single
# "Android test build" pre-release (replaced every time). The desktop app's update
# check only looks at full releases, so nobody receives these as updates.
on:
  push:
    branches: [android-test]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/airag.jks"
            echo "AIRAG_KEYSTORE_FILE=$RUNNER_TEMP/airag.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key secret; building with the debug key."
          fi
      - name: Build APK
        env:
          AIRAG_BUILD_PYTHON: ${{ steps.py.outputs.python-path }}
          AIRAG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AIRAG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AIRAG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --stacktrace
      - name: Name the APK
        run: |
          v=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('airag/__init__.py').read())[1])")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/AIRAG-$v.apk"
          (cd dist && sha256sum "AIRAG-$v.apk" > "AIRAG-$v.apk.sha256")
          ls -la dist
          rm -f "$RUNNER_TEMP/airag.jks"
      - name: Remove the previous test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          target_commitish: ${{ github.sha }}
          name: Android test build
          prerelease: true
          make_latest: false
          body: "Test build of the AIRAG Android app from ${{ github.sha }}. Not a release; replaced by the next test build."
          files: dist/*
