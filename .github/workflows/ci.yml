name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check for committed secrets
        run: python tools/check_secrets.py
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Test
        run: python -m pytest -q

  # Same tests with only the packages the Android app ships (no trafilatura, ddgs, lxml; pydantic 1)
  test-android-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-android.txt pytest
      - run: python -m pytest -q
        env:
          AIRAG_PLATFORM: android

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/airag.jks"
            echo "AIRAG_KEYSTORE_FILE=$RUNNER_TEMP/airag.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key secret; building with the debug key."
          fi
      - name: Build APK
        env:
          AIRAG_BUILD_PYTHON: ${{ steps.py.outputs.python-path }}
          AIRAG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AIRAG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AIRAG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --stacktrace
      - name: Name the APK
        run: |
          v=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('airag/__init__.py').read())[1])")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/AIRAG-$v.apk"
          (cd dist && sha256sum "AIRAG-$v.apk" > "AIRAG-$v.apk.sha256")
          ls -la dist
          rm -f "$RUNNER_TEMP/airag.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: AIRAG-android
          path: dist/*
