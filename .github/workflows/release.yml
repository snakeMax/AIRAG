name: Release

# Publishing a new version = changing __version__ in airag/__init__.py on main
# (python tools/release.py 1.2.3 does that). This workflow then builds the
# installer and creates the GitHub release + tag v1.2.3 if it doesn't exist yet.
# "Run workflow" by hand builds a test installer without publishing.
on:
  push:
    branches: [main]
    paths: ["airag/__init__.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read version
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python -c "import airag; print(airag.__version__)")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$V already exists - nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for committed secrets
        run: python tools/check_secrets.py

      - name: Install
        if: steps.v.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Test
        if: steps.v.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: python -m pytest -q

      - name: Install Inno Setup
        if: steps.v.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: choco install innosetup -y --no-progress

      - name: Build
        if: steps.v.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: python tools/build.py

      - name: Smoke test the built app
        if: steps.v.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: dist/AIRAG/AIRAG.exe --version

      - name: Upload build (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: airag-windows
          path: |
            dist/AIRAG-Setup-*.exe
            dist/AIRAG-*-portable-win64.zip

      - name: Release notes
        if: steps.v.outputs.exists == 'false' && github.event_name == 'push'
        shell: bash
        run: python tools/release_notes.py "${{ steps.v.outputs.version }}" > notes.md

      - name: Publish release
        if: steps.v.outputs.exists == 'false' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AIRAG ${{ steps.v.outputs.version }}
          body_path: notes.md
          files: |
            dist/AIRAG-Setup-*.exe
            dist/AIRAG-Setup-*.exe.sha256
            dist/AIRAG-*-portable-win64.zip
            dist/AIRAG-*-portable-win64.zip.sha256
